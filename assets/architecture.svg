      <ellipse cx="13" cy="14" rx="7.5" ry="10" fill="url(#eye)" stroke="#2e2350" stroke-width="2"/>
      <circle cx="-15" cy="10" r="3.2" fill="#fff"/><circle cx="-10" cy="18" r="1.5" fill="#fff"/>
      <circle cx="11" cy="10" r="3.2" fill="#fff"/><circle cx="16" cy="18" r="1.5" fill="#fff"/>
    </g>
    <ellipse cx="-24" cy="25" rx="6" ry="3" fill="#ff8fc7" opacity=".75"/>
    <ellipse cx="24" cy="25" rx="6" ry="3" fill="#ff8fc7" opacity=".75"/>
    <path d="M-6,27 Q-3,31 0,27 Q3,31 6,27" fill="none" stroke="#2e2350" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="ink" stroke-width="2.5" fill="#fff3ea">
    <ellipse cx="574" cy="176" rx="9" ry="7"/>
    <ellipse cx="626" cy="176" rx="9" ry="7"/>
  </g>

  <!-- speech bubble -->
  <path d="M668 92 H878 a14 14 0 0 1 14 14 V124 a14 14 0 0 1 -14 14 H684 L656 150 L668 136 a14 14 0 0 1 -14 -12 V106 a14 14 0 0 1 14 -14 Z" fill="#fff" class="ink" filter="url(#pop)"/>
  <text x="770" y="120" font-size="14" font-weight="700" text-anchor="middle">leave the routing to me~ ♪</text>


      <text x="994" y="310" style="fill:#6b5aa6">messages</text>
      <text x="994" y="390" style="fill:#6b5aa6">OAuth · ChatGPT plan</text>
      <text x="994" y="470" style="fill:#6b5aa6">OAuth · Claude plan</text>
    </g>
  </g>


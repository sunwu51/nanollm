name: Release binaries

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./package.json').version")"
          previous_version=""

          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
            previous_version="$(git show "${{ github.event.before }}:package.json" | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => console.log(JSON.parse(input).version || ''));")"
          fi

          changed=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$current_version" != "$previous_version" ]; then
            changed=true
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version previous_version=${previous_version:-<none>} changed=$changed"

  build:
    name: Build ${{ matrix.asset_name }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset_name: nanollm-windows-x64.exe
            executable_name: nanollm.exe
            postject_extra_args: ""
          - runner: ubuntu-24.04
            asset_name: nanollm-linux-x64
            executable_name: nanollm
            postject_extra_args: ""
          - runner: macos-14
            asset_name: nanollm-darwin-arm64
            executable_name: nanollm
            postject_extra_args: "--macho-segment-name NODE_SEA"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build JavaScript
        run: npm run build

      - name: Build pkg SEA binary
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @yao-pkg/pkg@6.21.0 . --targets host --out-path dist-sea

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          cp "dist-sea/${{ matrix.executable_name }}" "$tmpdir/${{ matrix.executable_name }}"
          chmod +x "$tmpdir/${{ matrix.executable_name }}" || true
          mkdir -p "$tmpdir/home"

          cat > "$tmpdir/smoke.config.yaml" <<'EOF'
          server:
            port: 31991
          models: []
          EOF

          HOME="$tmpdir/home" "$tmpdir/${{ matrix.executable_name }}" --config "$tmpdir/smoke.config.yaml" --storage sqlite > dist-sea/smoke.log 2>&1 &
          pid="$!"

          cleanup() {
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if node -e "fetch('http://127.0.0.1:31991/health').then(r => r.json()).then(j => { if (!j.ok) process.exit(1) }).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 0.25
          done

          cat dist-sea/smoke.log
          exit 1

      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "dist-sea/${{ matrix.executable_name }}" "release/${{ matrix.asset_name }}"
          chmod +x "release/${{ matrix.asset_name }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - version
      - build
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_VERSION"
          notes="Binary release for nanollm $RELEASE_VERSION."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$RELEASE_VERSION" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi

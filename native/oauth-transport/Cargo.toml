[package]
name = "nanollm-oauth-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "brotli", "zstd", "deflate"] }
hyper-rustls = "=0.27.7"
rustls = "=0.23.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
